version: '3.8'

services:
  hssn-panel:
    build: .
    container_name: hssn-panel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - SECRET_KEY=${SECRET_KEY:-hssn-panel-secret-key-v2}
      - RAILWAY_PUBLIC_DOMAIN=${RAILWAY_PUBLIC_DOMAIN}
      - DATA_DIR=/data
      - WORKER_SYNC_INTERVAL=3600
      - SECRET_KEY=${SECRET_KEY:-hssn-panel-secret-key-v2}
    volumes:
      - spider_data:/data
      - /var/run/docker.sock:/var/run/docker.sock  # For managing Telegram proxy containers
    networks:
      - hssn-network
    restart: unless-stopped

  # Telegram MTProto Proxy - one instance per Telegram inbound
  # These are managed dynamically by the panel, but can be started manually too
  # Example: docker-compose up -d tg-proxy-1
  # The panel manages these dynamically via Docker API

networks:
  hssn-network:
    driver: bridge

volumes:
  spider_data:
    driver: local